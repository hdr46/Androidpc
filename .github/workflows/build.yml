plugins {
    id 'com.android.application' version '8.2.2'
}

android {
    compileSdk 34
    namespace 'com.xp.launcher'
    defaultConfig {
        applicationId "com.xp.launcher"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
